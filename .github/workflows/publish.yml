name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate exact release commit and tag
        env:
          RELEASE_TAG: "${{ github.event.release.tag_name }}"
          HAYSTACK_TELEMETRY_ENABLED: "false"
        run: |
          python scripts/check_release.py "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          pip install build twine -e '.[dev,langchain,haystack,llama-index]'
          pytest tests
          pytest integration_tests

      - name: Build and validate distributions
        env:
          RELEASE_TAG: "${{ github.event.release.tag_name }}"
        run: |
          python -m build
          twine check dist/*
          python scripts/check_release.py "$RELEASE_TAG"

      - name: Install wheel in clean environment and check exports
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/python" -I -c "import enterprise_rag_patterns as p; from importlib.metadata import version; import os; assert p.__version__ == version('enterprise-rag-patterns') == os.environ['RELEASE_TAG'].removeprefix('v'); assert all(hasattr(p, name) for name in p.__all__)"

      - name: Install sdist in clean environment and check exports
        run: |
          python -m venv "$RUNNER_TEMP/sdist-smoke"
          "$RUNNER_TEMP/sdist-smoke/bin/pip" install dist/*.tar.gz
          "$RUNNER_TEMP/sdist-smoke/bin/python" -I -c "import enterprise_rag_patterns as p; from importlib.metadata import version; import os; assert p.__version__ == version('enterprise-rag-patterns') == os.environ['RELEASE_TAG'].removeprefix('v'); assert all(hasattr(p, name) for name in p.__all__)"
          "$RUNNER_TEMP/sdist-smoke/bin/pip" check
          "$RUNNER_TEMP/wheel-smoke/bin/pip" check

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
