name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is legacy compatibility; 3.14 exercises the maintained core runtime.
        python-version: ["3.10", "3.11", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ruff
        run: pip install "ruff>=0.4.0"

      - name: Run ruff check
        run: ruff check src/ tests/

      - name: Run ruff format check
        run: ruff format --check src/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy
        run: mypy src/

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install hash-locked release build tools
        run: |
          python -m venv "$RUNNER_TEMP/release-tools"
          "$RUNNER_TEMP/release-tools/bin/python" -m pip install --require-hashes -r ci/release-build-requirements.txt
          "$RUNNER_TEMP/release-tools/bin/python" -m pip check
          "$RUNNER_TEMP/release-tools/bin/python" -m pip --version
          "$RUNNER_TEMP/release-tools/bin/python" -m pip list --format=freeze

      - name: Build distribution
        run: |
          "$RUNNER_TEMP/release-tools/bin/python" -m build --no-isolation

      - name: Check distribution
        run: |
          "$RUNNER_TEMP/release-tools/bin/python" -m twine check dist/*

      - name: Verify installable
        run: pip install dist/*.whl --force-reinstall

  real-sdk-boundaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
        dependencies: [minimum, latest]
    env:
      HAYSTACK_TELEMETRY_ENABLED: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[test,langchain,haystack,llama-index]'
      - if: matrix.dependencies == 'minimum'
        run: pip install 'langchain-core==1.3.3' 'haystack-ai==2.20.0' 'llama-index-core==0.13.0'
      - run: pytest integration_tests --ignore=integration_tests/test_native_vector_categories.py

  native-vector-builders:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      HAYSTACK_TELEMETRY_ENABLED: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install reviewed native vector SDK cells
        run: python -m pip install -e '.[test,qdrant,weaviate]' 'qdrant-client==1.20.0' 'weaviate-client==4.24.1'
      - name: Exercise actual vector builders without skips
        run: |
          python -m pytest integration_tests/test_native_vector_categories.py --junitxml=vector-builders.xml
          python -c 'import xml.etree.ElementTree as E; r=E.parse("vector-builders.xml").getroot(); assert len(r.findall(".//testcase")) >= 3; assert not r.findall(".//skipped"); assert not r.findall(".//failure"); assert not r.findall(".//error")'
