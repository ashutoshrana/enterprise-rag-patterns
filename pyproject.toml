[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-patterns"
version = "0.1.0"
description = "Reference patterns for retrieval-augmented enterprise workflows and governed AI integration."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Ashutosh Rana" }
]
license = { text = "MIT" }
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
