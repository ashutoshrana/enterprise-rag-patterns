[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-patterns"
version = "0.11.0"
description = "Cross-industry compliance patterns for RAG pipelines: FERPA, HIPAA, GDPR, NIST AI RMF, OWASP LLM Top 10, and more. Vector store adapters, framework integrations, and audit logging."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Ashutosh Rana" }
]
keywords = [
  "rag",
  "retrieval-augmented-generation",
  "ferpa",
  "hipaa",
  "gdpr",
  "nist-ai-rmf",
  "owasp-llm",
  "enterprise-ai",
  "compliance",
  "llm",
  "higher-education",
  "healthcare-ai",
  "regulated-ai",
  "agentic-ai",
  "enterprise-patterns",
  "ai-governance",
  "prompt-injection",
  "pii-redaction",
  "pgvector",
  "postgresql",
  "eu-ai-act",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
  "Topic :: Office/Business",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ashutoshrana/enterprise-rag-patterns"
Issues = "https://github.com/ashutoshrana/enterprise-rag-patterns/issues"
Changelog = "https://github.com/ashutoshrana/enterprise-rag-patterns/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov>=4.0"]
lint = ["ruff>=0.4.0"]
typecheck = ["mypy>=1.0"]
llama-index = ["llama-index-core>=0.12.0"]
haystack = ["haystack-ai>=2.20.0"]
langchain = ["langchain-core>=0.3.0"]
pinecone = ["pinecone>=8.0.0"]
weaviate = ["weaviate-client>=4.10.0"]
qdrant = ["qdrant-client>=1.9.0"]
chromadb = ["chromadb>=1.0.0"]
maf = ["microsoft-agent-framework>=1.0.0"]
all = ["enterprise-rag-patterns[llama-index,haystack,langchain,pinecone,weaviate,qdrant,chromadb,maf]"]
dev = [
  "enterprise-rag-patterns[test,lint,typecheck]",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
